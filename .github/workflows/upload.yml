yaml
name: Upload IPA to App Store Connect

on:
  workflow_dispatch: # This adds a manual "Run workflow" button in your GitHub dashboard

jobs:
  upload:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Private Key File
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_PRIVATE_KEY }}" > ~/.appstoreconnect/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app \
            -f "$(ls *.ipa | head -n 1)" \
            --type ios \
            --apiKey "${{ secrets.APP_STORE_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_ISSUER_ID }}"
